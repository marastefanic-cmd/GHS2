name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Node 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - name: npm install and npm run build
        run: |
          npm install --no-audit --no-fund
          npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"
      - name: Serve the app for deep links
        run: cp dist/gloomhavensecretariat/index.html dist/gloomhavensecretariat/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/gloomhavensecretariat/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
